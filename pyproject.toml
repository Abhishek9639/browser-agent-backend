[project]
name = "browser-agent-backend"
version = "0.1.0"
description = "Supervised autonomous browser automation agent (AI-07) - backend service"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.8.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "openai>=3.19.2",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.14.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "mypy>=1.18.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pre-commit>=4.3.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "demo_sites", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # import sorting
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # bugbear
    "C4",     # comprehensions
    "SIM",    # simplify
    "RET",    # return consistency
    "PTH",    # use pathlib
    "ASYNC",  # async correctness
    "S",      # bandit security
    "T20",    # no print/pprint
    "ARG",    # unused arguments
    "RUF",    # ruff-specific
]
ignore = [
    "S101",  # assert is fine; pytest relies on it
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ARG",   # fixtures are injected and may go unused
    "S105",  # obviously-fake digests in test data
    "S106",
    "S311",  # seeded randomness for fixture data, not crypto
]
# The error classes are named in the spec and the part prompt (NotFound, Conflict,
# RateLimited...). They read better at the raise site than a blanket Error suffix.
"app/core/errors.py" = ["N818"]
# BudgetExceeded reads better at the raise site than BudgetExceededError.
"app/agent/budget.py" = ["N818"]
# IllegalTransition reads better at the raise site than IllegalTransitionError.
"app/domain/state_machine.py" = ["N818"]
# Deliberate no-op stand-ins. Their arguments are the contract the real
# implementations will honour, not dead weight to be trimmed.
"app/agent/contracts.py" = ["ARG002"]
# Mirrors Playwright's own wait_for_load_state(timeout=...) signature. The
# real bound is the asyncio.timeout around the call, not this argument.
"app/agent/browser/stability.py" = ["ASYNC109"]
# CLI tools whose whole job is printing to a terminal.
# A command line tool writing a report file blocks on purpose; there is
# no event loop starved by it.
"scripts/**" = ["T201", "ASYNC240"]
# LLMTimeout, LLMRateLimited and friends read better at the raise site.
"app/agent/llm/base.py" = ["N818"]
# Alembic writes these. `op` and `sa` are always imported whether or not a
# given revision uses them, and the module docstring is the revision header.
"migrations/versions/*.py" = ["F401", "INP001"]
# S104: the mock site binds 0.0.0.0 inside docker on purpose.
# S311: its randomness is meant to be reproducible, not secure. The whole
# point is that the same search returns the same flights every time.
"demo_sites/**" = ["S104", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["app", "demo_sites", "tests"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
files = ["app", "demo_sites"]
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
pretty = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One session-scoped loop, so the integration engine can be built once.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: needs Postgres (make test-int)",
    "chaos: runs against the demo sites",
    "eval: agent evaluation suite",
    "browser: drives a real Chromium (needs `make browsers`)",
    "live: calls a real LLM API and costs money (needs LIVE_LLM=1 and a key)",
]

# ---------------------------------------------------------------- coverage

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
