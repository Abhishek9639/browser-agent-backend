# The whole of AI-07: the backend, the frontend and the payments service.
#
#   cd deploy
#   cp ../.env.full.example .env
#   docker compose -f docker-compose.full.yml up --build
#
# The build contexts are sibling checkouts by default, so the repositories sit
# beside each other:
#
#   ai-07/
#     browser-agent-backend/       <- this one
#     Browser-Automation-Agent/    the frontend
#     browser-agent-payments/      not built yet
#
# If the frontend is checked out somewhere else, set FRONTEND_DIR in deploy/.env
# to its path.
#
# The payments service does not exist yet, so it sits behind the `payments`
# profile and is left out unless asked for with `--profile payments`. Without it
# the backend runs with BILLING_ENABLED=false, which is its default.

services:
  postgres:
    image: postgres:16
    container_name: ai07-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agent_core}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # One server, three databases: agent_core, agent_core_test and payments.
      # The two services own separate schemas and never read each other's
      # tables; sharing a server is a development convenience, not a design.
      - ../scripts/db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agent_core}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build:
      context: ..
      target: api
    container_name: ai07-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Uncomment with the payments service. `service_healthy` rather than
      # started, because the API reserves credits on the first task and a
      # payments service that is still booting answers 503.
      # payments:
      #   condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agent_core}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AGENT_ALLOWED_DOMAINS: ${AGENT_ALLOWED_DOMAINS:-localhost,127.0.0.1}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Turn on with the payments service, and not before: enabled with nothing
      # to call means every task submission answers 503.
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      PAYMENTS_BASE_URL: ${PAYMENTS_BASE_URL:-http://payments:8100}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      METRICS_INTERNAL_TOKEN: ${METRICS_INTERNAL_TOKEN:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - api_storage:/app/storage
      - api_keys:/app/keys

  # --------------------------------------------------------------- frontend
  frontend:
    build:
      context: ${FRONTEND_DIR:-../../Browser-Automation-Agent}
      # Build arguments, not environment: the frontend's build writes both into
      # what it produces, so they cannot be changed when the container starts.
      args:
        # Called by the frontend's server, which is on the compose network, so
        # the service name.
        BACKEND_URL: http://api:8000
        # Opened by the visitor's browser, which is not on the compose network,
        # so an address on the host. wss:// once the site is served over HTTPS.
        NEXT_PUBLIC_BACKEND_WS_URL: ${NEXT_PUBLIC_BACKEND_WS_URL:-ws://localhost:8000}
    container_name: ai07-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  # --------------------------------------------------------------- payments
  # Not built yet. Started only with `--profile payments`; leave
  # BILLING_ENABLED=false until it is.
  payments:
    profiles: ["payments"]
    build:
      context: ../../browser-agent-payments
    container_name: ai07-payments
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Its own database on the same server. The init script creates it.
      POSTGRES_DB: ${PAYMENTS_DB:-payments}
      # The other half of the shared secret the backend sends as
      # X-Internal-Token. Both sides read the same variable.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      # Razorpay TEST mode only for the OJT (spec section 7).
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      # Verifying tokens the backend minted, fetched from its JWKS endpoint.
      JWKS_URL: ${JWKS_URL:-http://api:8000/.well-known/jwks.json}
    ports:
      - "${PAYMENTS_PORT:-8100}:8100"

volumes:
  postgres_data:
    name: ai07_postgres_data
  api_storage:
    name: ai07_api_storage
  api_keys:
    name: ai07_api_keys
