<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cookie modal</title>
<style>
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 9999; }
  #dialog { position: fixed; top: 30%; left: 25%; width: 50%; background: #fff; padding: 24px; z-index: 10000; }
  #behind { margin-top: 40px; }
</style></head>
<body>
  <h1>Search</h1>
  <button id="behind">Search flights</button>
  <a id="behind-link" href="/results">See all results</a>
  <div id="overlay"></div>
  <div id="dialog" role="dialog" aria-modal="true" aria-label="Cookie choices">
    <p>We use cookies.</p>
    <button id="accept">Accept all</button>
    <button id="reject">Reject non-essential</button>
  </div>
</body></html>
