<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SkyFare search</title></head>
<body>
  <h1>Find a flight</h1>
  <form id="search">
    <label for="from">From</label>
    <input id="from" name="from" type="text" placeholder="Departure city" value="Delhi">
    <label for="to">To</label>
    <input id="to" name="to" type="text" placeholder="Arrival city">
    <label for="date">Date</label>
    <input id="date" name="date" type="date" value="2026-10-20">
    <label for="cabin">Cabin</label>
    <select id="cabin" name="cabin">
      <option value="economy">Economy</option>
      <option value="business">Business</option>
    </select>
    <label><input id="direct" name="direct" type="checkbox" checked> Direct only</label>
    <textarea id="notes" name="notes" placeholder="Anything else?"></textarea>
    <button id="submit" type="submit">Search flights</button>
    <button id="reset" type="reset" disabled>Reset</button>
  </form>
  <a id="help" href="/help?topic=booking">Booking help</a>
  <div id="fake-button" style="cursor:pointer" onclick="void 0">Styled like a button</div>
  <div id="wrapper" style="cursor:pointer"><button id="inner">Real button inside pointer wrapper</button></div>
</body></html>
