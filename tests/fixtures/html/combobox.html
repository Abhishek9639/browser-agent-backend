<!doctype html>
<html>
<head><meta charset="utf-8"><title>Combobox</title></head>
<body>
  <!-- The shape of a flight search's "Where to?": an ARIA combobox wrapper
       with the real field inside it. fill() refuses the wrapper. -->
  <div id="where-to" role="combobox" aria-label="Where to?" aria-expanded="false">
    <input id="where-to-input" type="text" placeholder="Where to?">
  </div>

  <!-- A combobox with no field of its own: clicking it opens a popup whose
       input takes the focus, which is where the typing has to land. -->
  <div id="from" role="combobox" aria-label="Where from?" tabindex="0">Where from?</div>
  <div id="popup" hidden><input id="popup-input" type="text" aria-label="Where else?"></div>
  <script>
    document.getElementById('from').addEventListener('click', () => {
      document.getElementById('popup').hidden = false;
      document.getElementById('popup-input').focus();
    });
  </script>
</body>
</html>
