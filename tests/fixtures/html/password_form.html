<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Payment</title></head>
<body>
  <h1>Pay</h1>
  <form id="pay">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="traveller@example.test">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" value="hunter2-the-real-one">
    <label for="cardNumber">Card number</label>
    <input id="cardNumber" name="cardNumber" type="text" value="4111111111111111">
    <label for="cvv">CVV</label>
    <input id="cvv" name="cvv" type="text" value="737">
    <label for="otp">OTP</label>
    <input id="otp" name="otp" type="text" value="908112">
    <label for="pin">PIN</label>
    <input id="pin" name="pin" type="text" value="4429">
    <button id="pay-now">Pay now</button>
  </form>
</body></html>
